      The `instructions` you pass, EXACTLY:

         ### Exercise: write NMI

         /// details | 📋 Task
             type: lh-task

         **Carried over:**
         - `np` is numpy.

         **Task:**
         - Write `nmi(a, b)` from the lecture's definition,
           $\mathrm{NMI} = \dfrac{2\,I(a;b)}{H(a) + H(b)}$, with
           $H = -\sum p \ln p$ and $I = \sum p_{ab} \ln \dfrac{p_{ab}}{p_a\,p_b}$.
         - $p_{ab}$ is the share of airports with each pair of labels, and $p_a$ and $p_b$ are the row totals and the column totals of $p_{ab}$.
         - The last line must print 1.0 and 0.0.

         **Other tools:**
         - `np.unique(x, return_inverse=True)[1]` numbers the labels of `x` from 0: for `["b", "a", "b"]` the result is `[1, 0, 1]`.
         - `np.add.at(t, (i, j), 1)` adds 1 to `t[i, j]` for each pair taken from the lists `i` and `j`.
         - `np.outer([1, 2], [3, 4])` is the table of every product: `[[3, 4], [6, 8]]`.
         ///
    ask: |
      Build the box; say nothing about putting it up:
      "Fill in the blanks, run the cell, and press Submit to Tutor when you want me to look."
      END YOUR TURN and wait for Submit.
    accept: |
      The hidden check (check_nmi) passes when their nmi matches the
      lecture's definition on small tables, on strings (continent against
      country) and on real groups. Any log base passes, as the base cancels.
      `np.unique(a, return_inverse=True)[1]`, `np.add.at(table, (ia, ib), 1)`,
      `p_ab.sum(axis=1)` and `axis=0`, `-(p_a * np.log(p_a)).sum()`,
      `(p_ab[seen] * np.log(p_ab[seen] / np.outer(p_a, p_b)[seen])).sum()`,
      `2 * mi / (h_a + h_b)`.
      Wrong turns: no factor 2; the log of zero cells (nan: ask what p_ab is
      in an empty cell); summing the table where p_ab is 0 without `seen`;
      using the labels as indexes, which fails on strings.
    hints:
      - "What does the last print give for the first pair? What should the last print give?"
      - "Try np.unique on a short list of strings. What does the second part of the answer hold?"
      - "An empty cell has p_ab equal to 0. What is the log of 0, and which line keeps the empty cells out?"
      - "Look at the formula again: what multiplies the mutual information on top?"
    reveal_after: |
      Say ONLY the ➤ lines. The rest is the note cell's.
      ➤ Renaming the groups does not change NMI, because NMI reads only the table of counts.
    note: |
      ### NMI from a table of counts

      ```python
      ia, ib = np.unique(a, return_inverse=True)[1], np.unique(b, return_inverse=True)[1]
      table = np.zeros((ia.max() + 1, ib.max() + 1)); np.add.at(table, (ia, ib), 1)
      p_ab = table / table.sum(); p_a, p_b = p_ab.sum(axis=1), p_ab.sum(axis=0)
      h_a, h_b = -(p_a * np.log(p_a)).sum(), -(p_b * np.log(p_b)).sum()
      seen = p_ab > 0
      mi = (p_ab[seen] * np.log(p_ab[seen] / np.outer(p_a, p_b)[seen])).sum()
      nmi = 2 * mi / (h_a + h_b)
      ```

      Only the table of counts matters, so renaming the groups changes nothing. Tip: `np.add.at` fills the table without a loop over the airports.

